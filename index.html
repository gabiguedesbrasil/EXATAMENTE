<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXATAMENTE</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f5fb;
            color: #29243a;
            text-align: center;
        }
        header {
            background: #6045a5;
            color: white;
            padding: 35px 20px;
        }
        h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }
        main {
            padding: 40px 20px;
        }
        .card {
            background: white;
            max-width: 420px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 3px 12px #00000012;
        }
        button {
            background: #6045a5;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <header>
        <h1>EXATAMENTE</h1>
        <p>Aprender juntos transforma tudo.</p>
    </header>
    <main>
        <div class="card">
            <h2>Bem-vindo!</h2>
            <p>Seu espaço de aprendizagem colaborativa está começando.</p>
            <button>Vamos estudar!</button>
        </div>
    </main>
</body>
</html>
